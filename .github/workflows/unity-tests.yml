name: 'Run Unity Tests'

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:

jobs:
  test-editmode:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project code
        uses: actions/checkout@v4

      - name: Cache Unity library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**') }}
          restore-keys: |
            Library-

      - name: Check if UNITY_LICENSE secret is available
        run: |
          if [ -z "${{ secrets.UNITY_LICENSE }}" ]; then
            echo "::error::FAILURE: UNITY_LICENSE secret is NOT available or empty."
            exit 1
          else
            echo "SUCCESS: UNITY_LICENSE secret was found and is not empty."
          fi

      - name: Run Unity EditMode Tests
        uses: game-ci/unity-test-runner@v3
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          unityVersion: '2021.3.18f1'
          testMode: 'EditMode'